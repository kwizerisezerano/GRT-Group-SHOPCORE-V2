[package]
name = "shopcore-desktop"
version = "1.0.0"
description = "ShopCore Cloud ERP desktop application for retail, inventory, finance, procurement and business operations."
authors = ["GRT Group"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "shopcore_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
